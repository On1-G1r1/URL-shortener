services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: 8080
      BASE_URL: http://localhost:8080
      POSTGRES_DSN: postgres://user:password@postgres:5432/shortener?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_TTL: 24h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shortener
    volumes:
      - ./migrations/00001_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
